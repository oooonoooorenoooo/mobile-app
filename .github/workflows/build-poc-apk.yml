name: Build PoC APK

on:
  push:
    branches:
      - feature-boot-announcement-endpoint
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install stable PoC debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          echo '' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Apply PoC announcement audio patch
        run: python3 .github/scripts/patch_poc_audio.py

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build PoC debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload PoC APK
        uses: actions/upload-artifact@v4
        with:
          name: music-assistant-poc-apk
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error
          retention-days: 14
